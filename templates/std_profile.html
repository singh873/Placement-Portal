<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title> Update Your Profile </title>
</head>
<body>
    <div class="l_form">
        <h2>  Update Your Profile </h2>

        <form action="/std_prof_update/{{ this_std.id }}" method="POST">

    <div class="row">
        <div class="col">
            <label>Full Name</label>
            <input type="text" name="f_name" value="{{ this_std.full_name }}">
        </div>

        <div class="col">
            <label>Email</label>
            <input type="email" name="email" value="{{ this_std.email }}" readonly>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label>Enter Education</label>
            <input type="text" name="edu" value="{{ this_std.education }}">
        </div>

        <div class="col">
            <label>Enter CGPA</label>
            <input type="text" name="cgpa" value="{{ this_std.cgpa }}">
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label>Enter Address</label>
            <input type="text" name="addr" value="{{ this_std.address }}">
        </div>

        <div class="col">
            <label>Linkedin Id</label>
            <input type="text" name="link" value="{{ this_std.linkdin }}">
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label>Github Id</label>
            <input type="text" name="git" value="{{ this_std.github }}">
        </div>

        <div class="col">
            <label>Enter Hobby</label>
            <input type="text" name="hobby" value="{{ this_std.hobby }}">
        </div>
    </div>

    <input class="btn" type="submit" value="Update Profile">

</form>


    </div>
</body>
</html>
