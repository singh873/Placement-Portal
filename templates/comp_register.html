<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Register</title>
</head>
<body>
    <div class="l_form">
        <h2> Welocome, Register Here </h2>

        <form action="/comp_register" method="POST">

            <label for="name"> Enter Company Name </label> 
            <input id="name" type="text" name="c_name" required>

            <label for="email"> Enter Email Id </label> 
            <input id="email" type="email" name="email" required> 

            <label for="pass"> Create Password </label> 
            <input id="pass" type="password" name="pwd" required> 

            <label for="num"> Enter Company Number </label> <br>
            <input id="num" type="text" name="num" required> 

            <label for="web"> Enter Company Website </label> 
            <input id="web" type="text" name="web" required>  

            <input class="btn" type="submit" value="Register">
        </form>

        <p>Already have an Account? <a href="/login">Login Now</a></p>

    </div>
</body>
</html>
